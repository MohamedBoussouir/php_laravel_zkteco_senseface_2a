; Transport for standard UDP SIP (ZKTeco Device)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; Transport for WebSockets (WebRTC Dashboard)
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; ==============================
; WebRTC Extension (Dashboard: 100)
; ==============================
[100]
type=endpoint
transport=transport-ws
context=intercom
disallow=all
allow=ulaw,alaw,vp8,h264
aors=100
auth=auth100
webrtc=yes
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_encryption=dtls
media_use_received_transport=yes
rtcp_mux=yes
max_audio_streams=1
max_video_streams=1
direct_media=no

[auth100]
type=auth
auth_type=userpass
password=dashboardpass
username=100

[100]
type=aor
max_contacts=1
remove_existing=yes

; ==============================
; ZKTeco Device Extension (SenseFace: 101)
; ==============================
[101]
type=endpoint
transport=transport-tcp
context=intercom
disallow=all
allow=ulaw,alaw,vp8,h264
aors=101
auth=auth101
dtmf_mode=rfc4733
max_audio_streams=1
max_video_streams=1
direct_media=no

[auth101]
type=auth
auth_type=userpass
password=zktecopass
username=101

[101]
type=aor
max_contacts=1
remove_existing=yes
