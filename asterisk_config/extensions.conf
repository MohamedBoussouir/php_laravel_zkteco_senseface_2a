[intercom]
; If ZKTeco (101) dials 100, ring the dashboard
exten => 100,1,NoOp(Incoming call from ZKTeco to Dashboard)
exten => 100,n,Dial(PJSIP/100,30)
exten => 100,n,Hangup()

; If Dashboard (100) dials 101, ring ZKTeco (optional, for viewing camera without doorbell press)
exten => 101,1,NoOp(Outgoing call from Dashboard to ZKTeco)
exten => 101,n,Dial(PJSIP/101,30)
exten => 101,n,Hangup()
